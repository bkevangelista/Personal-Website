services:
  frontend:
    networks:
      - website-network
    build: 
      context: ./bevangelista-website
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL}
      dockerfile: Dockerfile
    env_file: ./bevangelista-website/.env
    ports:
      - "3000:8080"
    develop:
      watch:
        - action: sync
          path: bevangelista-website
          target: /code
    command: "node server.js"
  backend:
    networks:
      - website-network
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    volumes:
      - ${GCP_KEY_PATH}:/app/gcp_key.json
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp_key.json
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 5s

networks:
  website-network:
    driver: bridge